## Python package
## Create and test a Python package on multiple Python versions.
## Docs: https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: TestOnMultiplePython
  displayName: "Test on multiple Python versions"
  strategy:
    matrix:
      Python38:
        python.version: '3.8'
      Python39:
        python.version: '3.9'
      Python310:
        python.version: '3.10'
      Python311:
        python.version: '3.11'
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
    displayName: 'Use Python $(python.version)'

  - script: |
      python -m pip install --upgrade pip
    displayName: 'Upgrade pip'

  - script: |
      if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "No requirements.txt found"; fi
    displayName: 'Install dependencies (if any)'

  - script: |
      pip install pytest pytest-azurepipelines
      if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ] || ls -1 *test*.py >/dev/null 2>&1; then \
        pytest; \
      else \
        echo "No tests found, skipping pytest"; \
      fi
    displayName: 'Run tests (if present)'

  - script: |
      if [ -f helloworld.py ]; then python helloworld.py; else echo "helloworld.py not found, skipping"; fi
    displayName: 'Run helloworld.py (optional)'
    
